version: 2

# Security advisories arrive as GitHub alerts either way; this config is what
# turns them into reviewable PRs with CI attached, instead of an email that
# someone has to act on by hand.
#
# Majors are deliberately split from minors and patches. Grouping them together
# produces one PR that can never merge — the first run bundled Next 15→16 and
# TypeScript 5→7 with routine patches, and both PRs failed the build as a whole.
# Routine updates should flow on their own; a major deserves its own PR, its own
# red build, and a decision.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    groups:
      # One PR for everything routine: these move together on a single Next.js
      # deploy anyway, and reviewing them together is how you spot a bad
      # combination that each bump alone would pass.
      routine:
        update-types: ["minor", "patch"]
      # Majors still group, but separately and one ecosystem at a time, so a
      # failing React major never blocks a working tooling major.
      major-react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major"]
      major-next:
        patterns: ["next", "@next/*", "eslint-config-next"]
        update-types: ["major"]
      major-tooling:
        dependency-type: development
        update-types: ["major"]
    ignore:
      # next-auth is intentionally pinned to an exact beta: on a prerelease line
      # a caret would accept breaking betas. Upgrades here are a manual decision,
      # and security advisories reach us through Dependabot alerts regardless.
      - dependency-name: next-auth
      # The majors below are already triaged and tracked: Next 16 in #110, the
      # dev toolchain in #111. Closing their PRs is not enough — Dependabot
      # recreates a closed PR on the next weekly run, and each one costs two red
      # Vercel preview builds and the failure emails that come with them. Lifting
      # these entries is part of doing the upgrade, not a separate decision.
      #
      # eslint and eslint-config-next are peer-coupled and must move together:
      # eslint-config-next@15 requires eslint ^9, so bumping eslint alone fails
      # at npm install, before the build even starts. That is why they cannot be
      # left to two different major groups.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: chore
