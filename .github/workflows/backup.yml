name: Daily Neon Backup

# Runs every day at 03:00 UTC (≈ 04:00–05:00 Europe/Rome).
# Dumps the production Neon database with pg_dump, gzips the result,
# uploads it to Google Drive via rclone, then prunes backups older than
# 90 days from the same folder. Also runnable on demand from the Actions
# tab via "Run workflow".
#
# Required GitHub repository secrets:
#   - DATABASE_URL        Neon production connection string (postgresql://...)
#   - RCLONE_CONFIG       Full contents of ~/.config/rclone/rclone.conf
#                         (must define a remote named exactly `gdrive`)
#   - GDRIVE_BACKUP_PATH  Destination, e.g. `gdrive:PortaMoneta/GAS-Backups`
#
# Restore: see AGENTS.md → "Backup & Restore" section.
#
# After the backup, the `invariants` job checks read-only that the books add
# up (lib/invariants.ts): a failure fails the run and GitHub emails the owner.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL 17 client (matches Neon)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # The Ubuntu runner pre-installs pg-client 16 and the /usr/bin/pg_dump
          # wrapper picks it instead of 17. Prepend the v17 bin dir to PATH so
          # subsequent steps see pg_dump 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install rclone
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write rclone config from secret
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          FILE="gas-backup-${DATE}.sql.gz"
          echo "Dumping to ${FILE}…"
          pg_dump \
            --no-owner \
            --no-privileges \
            --format=plain \
            "$DATABASE_URL" \
            | gzip -9 > "$FILE"
          ls -lh "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to Google Drive
        run: |
          set -euo pipefail
          rclone copy "$BACKUP_FILE" "${{ secrets.GDRIVE_BACKUP_PATH }}" \
            --s3-no-check-bucket \
            --stats=0 \
            -v
          echo "Uploaded $BACKUP_FILE to ${{ secrets.GDRIVE_BACKUP_PATH }}"

      # Retention: 90 days. Scoped to this workflow's own files only
      # (gas-backup-*.sql.gz, top level of the destination folder), so any
      # other file kept there by hand is never touched. Runs after a
      # successful upload only, so a failing dump never prunes old backups.
      # Google Drive moves deleted files to the trash (rclone default).
      - name: Prune backups older than 90 days
        env:
          DEST: ${{ secrets.GDRIVE_BACKUP_PATH }}
        run: |
          set -euo pipefail
          # Refuse to prune anything but a remote path (e.g. gdrive:...): an
          # empty secret would otherwise make rclone act on the runner's cwd.
          case "$DEST" in
            *:*) ;;
            *) echo "GDRIVE_BACKUP_PATH is not a remote path, skipping prune" >&2; exit 1 ;;
          esac
          rclone delete "$DEST" \
            --include "gas-backup-*.sql.gz" \
            --min-age 90d \
            --max-depth 1 \
            --stats=0 \
            -v

      - name: Cleanup local files
        if: always()
        run: |
          rm -f gas-backup-*.sql.gz
          rm -f "$HOME/.config/rclone/rclone.conf"

  invariants:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # SELECT only; prints check names and row ids, never member data.
      - name: Check the money invariants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node node_modules/tsx/dist/cli.mjs scripts/check-invariants.mts

