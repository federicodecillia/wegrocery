name: Daily Neon Backup

# Runs every day at 03:00 UTC (≈ 04:00–05:00 Europe/Rome).
# Dumps the production Neon database with pg_dump, gzips the result,
# uploads it to Google Drive via rclone, then prunes backups older than
# 90 days from the same folder. Also runnable on demand from the Actions
# tab via "Run workflow".
#
# Required GitHub repository secrets:
#   - DATABASE_URL        Neon production connection string (postgresql://...)
#   - RCLONE_CONFIG       Full contents of ~/.config/rclone/rclone.conf
#                         (must define a remote named exactly `gdrive`)
#   - GDRIVE_BACKUP_PATH  Destination, e.g. `gdrive:PortaMoneta/GAS-Backups`
#
# Restore: see AGENTS.md → "Backup & Restore" section.
#
# Alongside the backup, the `invariants` job checks read-only that the books
# add up (lib/invariants.ts). It does not wait for the backup: a stuck or
# failed dump must never hide a money problem. If either job fails or is
# cancelled (a timeout counts as cancelled, and GitHub's failure email may not
# fire for that), the `notify` job opens an issue, or comments on the one
# already open.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # A copy of the repository that never set up backups (a new installation, a
  # fork) has no DATABASE_URL secret: both jobs are skipped with a warning
  # instead of failing every night.
  configured:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DB" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No DATABASE_URL secret: backup and invariants skipped."
          fi

  backup:
    needs: configured
    if: needs.configured.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The install usually takes ~12 s, but once (2026-10-01) it hung with no
      # output until the job timeout. Every network command is now bounded and
      # retried, so a stalled mirror costs about a minute, not the whole job.
      - name: Install PostgreSQL 17 client (matches Neon)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "giving up: $*" >&2; return 1; fi
              echo "attempt $n failed, retrying: $*" >&2
              sleep $((n * 10))
            done
          }
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          sudo install -d /usr/share/postgresql-common/pgdg
          retry sudo curl -fsSL --connect-timeout 10 --max-time 30 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          retry sudo timeout -k 10 90 apt-get $APT_OPTS update
          retry sudo timeout -k 10 120 apt-get $APT_OPTS install -y --no-install-recommends postgresql-client-17
          # The Ubuntu runner pre-installs pg-client 16 and the /usr/bin/pg_dump
          # wrapper picks it instead of 17. Prepend the v17 bin dir to PATH so
          # subsequent steps see pg_dump 17.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install rclone
        timeout-minutes: 3
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write rclone config from secret
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          FILE="gas-backup-${DATE}.sql.gz"
          echo "Dumping to ${FILE}…"
          pg_dump \
            --no-owner \
            --no-privileges \
            --format=plain \
            "$DATABASE_URL" \
            | gzip -9 > "$FILE"
          ls -lh "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to Google Drive
        run: |
          set -euo pipefail
          rclone copy "$BACKUP_FILE" "${{ secrets.GDRIVE_BACKUP_PATH }}" \
            --s3-no-check-bucket \
            --stats=0 \
            -v
          echo "Uploaded $BACKUP_FILE to ${{ secrets.GDRIVE_BACKUP_PATH }}"

      # Retention: 90 days. Scoped to this workflow's own files only
      # (gas-backup-*.sql.gz, top level of the destination folder), so any
      # other file kept there by hand is never touched. Runs after a
      # successful upload only, so a failing dump never prunes old backups.
      # Google Drive moves deleted files to the trash (rclone default).
      - name: Prune backups older than 90 days
        env:
          DEST: ${{ secrets.GDRIVE_BACKUP_PATH }}
        run: |
          set -euo pipefail
          # Refuse to prune anything but a remote path (e.g. gdrive:...): an
          # empty secret would otherwise make rclone act on the runner's cwd.
          case "$DEST" in
            *:*) ;;
            *) echo "GDRIVE_BACKUP_PATH is not a remote path, skipping prune" >&2; exit 1 ;;
          esac
          rclone delete "$DEST" \
            --include "gas-backup-*.sql.gz" \
            --min-age 90d \
            --max-depth 1 \
            --stats=0 \
            -v

      - name: Cleanup local files
        if: always()
        run: |
          rm -f gas-backup-*.sql.gz
          rm -f "$HOME/.config/rclone/rclone.conf"

  invariants:
    needs: configured
    if: needs.configured.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # SELECT only; prints check names and row ids, never member data.
      - name: Check the money invariants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node node_modules/tsx/dist/cli.mjs scripts/check-invariants.mts

  notify:
    needs: [configured, backup, invariants]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP: ${{ needs.backup.result }}
          INVARIANTS: ${{ needs.invariants.result }}
        run: |
          set -euo pipefail
          TITLE="Nightly backup/invariants run needs attention"
          BODY="$(date -u +%F): backup ${BACKUP}, invariants ${INVARIANTS}. Run: ${RUN_URL}"
          # One open issue at a time: later failures comment on it instead of
          # opening a new one every night.
          OPEN=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
