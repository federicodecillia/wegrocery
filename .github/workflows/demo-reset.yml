name: Nightly Demo Reset

# Re-seeds the DEMO Neon database every night so the public demo always
# looks fresh (the open cycle's dates are relative to "now"). Also runnable
# on demand from the Actions tab.
#
# Required GitHub repository secret:
#   - DEMO_DATABASE_URL  Neon DEMO connection string (NOT production)
# Without it (a client installation, a fork) the job is skipped with a
# warning instead of failing every night.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  configured:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          HAS_DB: ${{ secrets.DEMO_DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DB" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No DEMO_DATABASE_URL secret: demo reset skipped."
          fi

  reset:
    needs: configured
    if: needs.configured.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed demo database
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          DEMO_MODE: "true"
        run: npx tsx scripts/seed-demo.ts
