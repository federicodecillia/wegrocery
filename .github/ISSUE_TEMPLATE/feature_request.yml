name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What does your group need to do that is hard or impossible today? Who is it for (members, admins, the person who runs the installation)?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today instead, or other ways to solve it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
